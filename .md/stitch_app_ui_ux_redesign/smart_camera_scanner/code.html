<script>
  // Dynamic UI Interactions for Camera Controls
  const shutterBtn = document.getElementById('shutterBtn');
  const flashBtn = document.getElementById('flashBtn');
  const modeAuto = document.getElementById('modeAuto');
  const modeManual = document.getElementById('modeManual');

  if (shutterBtn) {
    shutterBtn.addEventListener('click', () => {
      // Haptic tactile bounce feedback simulation
      shutterBtn.classList.add('scale-75');
      setTimeout(() => shutterBtn.classList.remove('scale-75'), 180);
    });
  }

  // Flash cycle toggle (Auto -> On -> Off)
  const flashIcons = ['flash_auto', 'flash_on', 'flash_off'];
  let currentFlashIdx = 0;
  if (flashBtn) {
    flashBtn.addEventListener('click', () => {
      currentFlashIdx = (currentFlashIdx + 1) % flashIcons.length;
      const iconSpan = flashBtn.querySelector('.material-symbols-outlined');
      if (iconSpan) iconSpan.textContent = flashIcons[currentFlashIdx];
    });
  }

  // Auto vs Manual Mode Switch
  if (modeAuto && modeManual) {
    modeAuto.addEventListener('click', () => {
      modeAuto.className = 'px-3.5 py-1.5 rounded-full font-label-md text-label-md bg-[#00855b] text-white shadow-sm transition-all flex items-center gap-1';
      modeManual.className = 'px-3.5 py-1.5 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all';
    });

    modeManual.addEventListener('click', () => {
      modeManual.className = 'px-3.5 py-1.5 rounded-full font-label-md text-label-md bg-[#00855b] text-white shadow-sm transition-all flex items-center gap-1';
      modeAuto.className = 'px-3.5 py-1.5 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all';
    });
  }
